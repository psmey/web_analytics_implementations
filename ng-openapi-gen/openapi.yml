  "components":
    {
      "schemas":
        {
          "appointmentEvaluation":
            {
              "type": "object",
              "properties":
                {
                  "valuationChange":
                    {
                      "type": "number",
                      "description": "Change of the target value, which is optimized by the system.",
                      "format": "float",
                    },
                  "costChange":
                    {
                      "type": "number",
                      "description": "Change of the overall costs.",
                      "format": "float",
                    },
                  "distanceChange":
                    {
                      "type": "number",
                      "description": "Change of the overall driven distance in kilometers.",
                      "format": "float",
                    },
                },
              "additionalProperties": false,
              "description": "This object describes several values for the evaluation of the proposal. The values reflect the changes to the whole planning, because of the holistic optimization approach.",
            },
          "appointmentProposalSettings":
            {
              "required":
                [
                  "costsEachProgressingDay",
                  "maxNumberDays",
                  "maxNumberProposals",
                  "oneProposalAfterXDaysWithoutResults",
                  "overbooking",
                  "routeInitiationValue",
                  "twoProposalsAfterXDaysWithoutResults",
                ],
              "type": "object",
              "properties":
                {
                  "costsEachProgressingDay":
                    {
                      "maximum": 100000,
                      "minimum": 0,
                      "type": "integer",
                      "description": "Penalty added to the proposal cost per day.\r\nTo make earlier apointments more attractive.",
                      "format": "int32",
                      "default": 0,
                    },
                  "routeInitiationValue":
                    {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer",
                      "description": "Penalty for opening a new tour.",
                      "format": "int32",
                      "default": 0,
                    },
                  "maxNumberDays":
                    {
                      "maximum": 28,
                      "minimum": 1,
                      "type": "integer",
                      "description": "Maximum number of days for which appointment proposals are calculated.",
                      "format": "int32",
                      "default": 28,
                    },
                  "overbooking":
                    {
                      "allOf":
                        [
                          {
                            "$ref": "#/components/schemas/overbookingRuleEnum",
                          },
                        ],
                      "description": "Overbooking rules.<p>One of:</p>\n<ul>\n<li>ALL: All planned calls.</li>\n<li>WITH_LOWER_PRIO: Only planned calls of lower priority than the new call.</li>\n<li>NONE: No overbooking is allowed</li>\n<li>RECORDED_AND_CONFIRMED_WITH_LOWER_PRIO: All recorded calls and confirmed calls of lower priority.</li>\n<li>RECORDED_ONLY: Only recorded, no confirmed calls.</li>\n</ul>\n",
                      "default": "ALL",
                      "x-extensible-enum": [],
                    },
                  "maxNumberProposals":
                    {
                      "maximum": 28,
                      "minimum": 1,
                      "type": "integer",
                      "description": "Maximum number of generated appointment proposals.",
                      "format": "int32",
                      "default": 28,
                    },
                  "oneProposalAfterXDaysWithoutResults":
                    {
                      "maximum": 28,
                      "minimum": 1,
                      "type": "integer",
                      "description": "If no appointment is found for x days, the maximum number of appointments to be generated is reduced to 1.",
                      "format": "int32",
                      "default": 25,
                    },
                  "twoProposalsAfterXDaysWithoutResults":
                    {
                      "maximum": 28,
                      "minimum": 1,
                      "type": "integer",
                      "description": "If no appointment is found for x days, the maximum number of appointments to be generated is reduced to 2.",
                      "format": "int32",
                      "default": 20,
                    },
                },
              "additionalProperties": false,
              "description": "Settings for appointment proposals.",
            },
