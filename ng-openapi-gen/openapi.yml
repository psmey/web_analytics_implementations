              "description": "Retrieves a list of calls and their details which matches the requested parameters but are not scheduled.\r\n            \r\nThe *escalatedCallsFilter* and the *recordedCallsFilter* are combined via \"OR\" and at least one of both **must** be set to get results.\r\nThe global field filters and the callTypeIds/priorities filters are combined via \"AND\".\r\n            \r\nRecorded calls refer to calls which have been recorded in the VisTour database but do not have an appointment yet.\r\nEscalated calls refer to calls that did not fit in the current shifts anymore but were already planned before and therefore await a new appointment.\r\n            \r\n**Use case 1**: Caller retrieves an overview of all recorded calls without an appointment that start after the 12th June of 2023.\r\n            \r\n**Use case 1 example**: When calling the endpoint with recordedCallsFilter.earliestStartDate = 2023-06-12, page = 2 and pagesize = 10,\r\nthe API responds with a paginated list of recorded calls starting after the 12th June 2023, starting with the 11th call and ending with the 20th one,\r\nor if there are less than 20 calls available, ending with the last available one.\r\n            \r\n**Use case 2**: Caller retrieves all open calls that require an expertise in plumbing or printers.\r\n            \r\n**Use case 2 example**: When calling the endpoint with globalFilters.expertises = plumbing and globalFilters.expertises = printers,\r\nthe API responds with a list of all open calls which require the expertiseIds plumbing or printers.\r\n            \r\n**Use case 3**: Caller retrieves all recorded calls without an appointment that start after the 12th June of 2023, are assigned to team One and that have a normal or high priority.\r\n            \r\n**Use case 3 example**: When calling the endpoint with recordedCallsFilter.earliestStartDate = 2023-06-12, globalFilters.teams = One, priorities = NORMAL and priorities = HIGH,\r\nthe API responds with a list of recorded calls starting after the 12th June 2023 that have a normal or high priority and are assigned to team One.",
              "operationId": "OpenCallsList.GetOpenCallsList",
              "parameters":
                [
                  {
                    "name": "page",
                    "in": "query",
                    "description": "The number of the page to load calls for.",
                    "schema":
                      {
                        "maximum": 2147483647,
                        "minimum": 1,
                        "type": "integer",
                        "format": "int32",
                      },
                  },
                  {
                    "name": "pagesize",
                    "in": "query",
                    "description": "The size of a single page.",
                    "schema":
                      {
                        "maximum": 1000,
                        "minimum": 1,
                        "type": "integer",
                        "format": "int32",
                      },
                  },
                  {
                    "name": "escalatedCallsFilter.earliestRouteDate",
                    "in": "query",
                    "schema":
                      { "allOf": [{ "$ref": "#/components/schemas/date" }] },
                  },
                  {
                    "name": "escalatedCallsFilter.latestRouteDate",
                    "in": "query",
                    "schema":
                      { "allOf": [{ "$ref": "#/components/schemas/date" }] },
                  },
                  {
                    "name": "recordedCallsFilter.earliestStartDate",
                    "in": "query",
                    "schema":
                      { "allOf": [{ "$ref": "#/components/schemas/date" }] },
                  },
                  {
                    "name": "recordedCallsFilter.latestStartDate",
                    "in": "query",
                    "schema":
                      { "allOf": [{ "$ref": "#/components/schemas/date" }] },
                  },
                  {
                    "name": "recordedCallsFilter.earliestEndDate",
                    "in": "query",
                    "schema":
                      { "allOf": [{ "$ref": "#/components/schemas/date" }] },
                  },
                  {
                    "name": "recordedCallsFilter.latestEndDate",
                    "in": "query",
                    "schema":
                      { "allOf": [{ "$ref": "#/components/schemas/date" }] },
                  },
                  {
                    "name": "globalFilters.expertises",
                    "in": "query",
                    "description": "Only items with expertise matching one of the given expertises are considered. If omitted, items are not filtered by expertises.",
                    "schema":
                      {
                        "maxItems": 100,
                        "type": "array",
                        "items":
                          { "$ref": "#/components/schemas/iDs_expertiseId" },
                      },
                  },
                  {
                    "name": "globalFilters.regions",
                    "in": "query",
                    "description": "Only items with region matching one of the given regions are considered. If omitted, items are not filtered by region.",
                    "schema":
                      {
                        "maxItems": 100,
                        "type": "array",
                        "items":
                          { "$ref": "#/components/schemas/iDs_regionId" },
                      },
                  },
                  {
                    "name": "globalFilters.teams",
                    "in": "query",
                    "description": "Only items with team matching one of the given teams are considered. If omitted, items are not filtered by teams.",
                    "schema":
                      {
                        "maxItems": 100,
                        "type": "array",
                        "items": { "$ref": "#/components/schemas/iDs_teamId" },
                      },
                  },
                  {
                    "name": "globalFilters.includeUnassignedExpertises",
                    "in": "query",
                    "description": "* true: Consider items without assigned expertise.\r\n* false: Consider items with assigned expertise.\r\n* null:\r\n  * if *globalFilters.expertises* is not set, there is no filtering by this attribute (not the same as true, because then only unassigned would be considered).\r\n  * if *globalFilters.expertises* is set, items with unassigned attribute are ignored (same effect as false).",
                    "schema": { "type": "boolean" },
                  },
                  {
                    "name": "globalFilters.includeUnassignedRegions",
                    "in": "query",
                    "description": "* true: Consider items without assigned regions.\r\n* false: Consider items with assigned regions.\r\n* null:\r\n  * if *globalFilters.regions* is not set, there is no filtering by this attribute (not the same as true, because then only unassigned would be considered).\r\n  * if *globalFilters.regions* is set, items with unassigned attribute are ignored (same effect as false).",
