      "/v1/scheduleBoard":
        {
          "get":
            {
              "tags": ["ScheduleBoard"],
              "summary": "Get schedule board display data.",
              "description": "Retrieves the scheduling data for displaying as for example a board within a client application.\r\nIt can contain different types of scheduling elements like calls, breaks, driving and waiting times or starting\r\nand ending elements for each shift of each resource determined by the given parameters and filters.\r\n            \r\n**Use case 1**: Caller needs the scheduled data of all resources for a specific date.\r\n            \r\n**Use case 1 example**: When calling the endpoint with start and end date of the same day, the API responds with\r\nthe scheduled data of all planned resources and all shifts of this date.\r\n            \r\n**Use case 2**: Caller needs the scheduled data of all resources working in a specific region for the upcoming week.\r\n            \r\n**Use case 2 example**: When calling the endpoint with start and end date of the upcoming week and in addition the region\r\nset as global filter, the API responds with the scheduled data of all planned resources of that region and all shifts\r\nin that week.",
              "operationId": "ScheduleBoard.GetScheduleBoard",
              "parameters":
                [
                  {
                    "name": "startDate",
                    "in": "query",
                    "description": "Start date of the date range.",
                    "required": true,
                    "schema":
                      { "allOf": [{ "$ref": "#/components/schemas/date" }] },
                  },
                  {
                    "name": "endDate",
                    "in": "query",
                    "description": "End date of the date range.\r\nThe maximum date range is 31 days.",
                    "required": true,
                    "schema":
                      { "allOf": [{ "$ref": "#/components/schemas/date" }] },
                  },
                  {
                    "name": "globalFilters.expertises",
                    "in": "query",
                    "description": "Only items with expertise matching one of the given expertises are considered. If omitted, items are not filtered by expertises.",
                    "schema":
                      {
                        "maxItems": 100,
                        "type": "array",
                        "items":
                          { "$ref": "#/components/schemas/iDs_expertiseId" },
                      },
                  },
                  {
                    "name": "globalFilters.regions",
                    "in": "query",
                    "description": "Only items with region matching one of the given regions are considered. If omitted, items are not filtered by region.",
                    "schema":
                      {
                        "maxItems": 100,
                        "type": "array",
                        "items":
                          { "$ref": "#/components/schemas/iDs_regionId" },
                      },
                  },
                  {
                    "name": "globalFilters.teams",
                    "in": "query",
                    "description": "Only items with team matching one of the given teams are considered. If omitted, items are not filtered by teams.",
                    "schema":
                      {
                        "maxItems": 100,
                        "type": "array",
                        "items": { "$ref": "#/components/schemas/iDs_teamId" },
                      },
                  },
                  {
                    "name": "globalFilters.includeUnassignedExpertises",
                    "in": "query",
                    "description": "* true: Consider items without assigned expertise.\r\n* false: Consider items with assigned expertise.\r\n* null:\r\n  * if *globalFilters.expertises* is not set, there is no filtering by this attribute (not the same as true, because then only unassigned would be considered).\r\n  * if *globalFilters.expertises* is set, items with unassigned attribute are ignored (same effect as false).",
                    "schema": { "type": "boolean" },
                  },
                  {
                    "name": "globalFilters.includeUnassignedRegions",
                    "in": "query",
                    "description": "* true: Consider items without assigned regions.\r\n* false: Consider items with assigned regions.\r\n* null:\r\n  * if *globalFilters.regions* is not set, there is no filtering by this attribute (not the same as true, because then only unassigned would be considered).\r\n  * if *globalFilters.regions* is set, items with unassigned attribute are ignored (same effect as false).",
                    "schema": { "type": "boolean" },
                  },
                  {
                    "name": "globalFilters.includeUnassignedTeams",
                    "in": "query",
                    "description": "* true: Consider items without assigned teams.\r\n* false: Consider items with assigned teams.\r\n* null:\r\n  * if *globalFilters.teams* is not set, there is no filtering by this attribute (not the same as true, because then only unassigned would be considered).\r\n  * if *globalFilters.teams* is set, items with unassigned attribute are ignored (same effect as false).",
                    "schema": { "type": "boolean" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "OK, the schedule is returned.",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/outgoing_scheduleBoard_scheduleBoard",
