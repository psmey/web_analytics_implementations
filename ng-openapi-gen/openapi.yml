onViolatedInvalidConstructRestrictionViolation</li>\n<li>RouteDurationExceededRestrictionViolation</li>\n<li>CallsDelayedRestrictionViolation</li>\n<li>MainRelationCallNotScheduledRestrictionViolation</li>\n<li>RelatedCallNotScheduledRestrictionViolation</li>\n<li>ReservationSetRestrictionViolation</li>\n<li>MinDeploymentRadiusNotExceededRestrictionViolation</li>\n<li>RouteMissingSkillsRestrictionViolation</li>\n<li>ResourceRestrictedToGeneralRouteRestrictionViolation</li>\n<li>RegionNotMatchingRestrictionViolation</li>\n<li>ExpertiseNotMatchingRestrictionViolation</li>\n<li>TeamNotMatchingRestrictionViolation</li>\n<li>ResourceExcludedRestrictionViolation</li>\n<li>ResourceNotAllowedRestrictionViolation</li>\n<li>ResourceNotPreferredRestrictionViolation</li>\n<li>OutsourcingNotAllowedRestrictionViolation</li>\n<li>OutsourcingRequiredRestrictionViolation</li>\n<li>StandbyRestrictionFixedResourceRestrictionViolation</li>\n<li>SchedulingInPastNotAllowedRestrictionViolation</li>\n<li>CallNotLoadedRestrictionViolation</li>\n<li>InvalidRelationPositionRestrictionViolation</li>\n<li>NoRouteAvailableRestrictionViolation</li>\n<li>MaxDrivingTimeToFirstCallExceededRestrictionViolation</li>\n<li>CallIsPartOfRelationRestrictionViolation</li>\n<li>CallAlreadyConfirmedSLARestrictionViolation</li>\n<li>CallAlreadyConfirmedRestrictionViolation</li>\n<li>NoFeasibleResourceAvailableRestrictionViolation</li>\n<li>ResourceNotFoundRestrictionViolation</li>\n<li>SchedulingExceedsDetourLimitRestrictionViolation</li>\n<li>RestrictionNotAvailable</li></ul>",
                                },
