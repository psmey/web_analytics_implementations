  "tags":
    [
      {
        "name": "CallHistory",
        "description": "Overview of changes made to the call.",
      },
      {
        "name": "CallType",
        "description": "Call types enable the classification of the type of work that has to be carried out for a call, e.g.\r\nan installation or a delivery.\r\n            \r\nCall types can be used to filter open calls or trigger optimization only for a certain type of calls.",
      },
      {
        "name": "Expertise",
        "description": "Expertises represent a discipline oriented structure.\r\n            \r\nAn expertise can be assigned to resources and calls. Assigning an expertise to an order can restrict the resources that can be scheduled to it.\r\nExpertises can be filtered with the global filters in various endpoints.",
      },
      {
        "name": "Optimization",
        "description": "An optimization seeks to determine the best route for resources, taking into account their limitations and benefits.",
      },
      {
        "name": "Region",
        "description": "A region represents a geographic area.\r\n            \r\nRegions can be assigned to calls and resources. Assigning a region to an order can restrict the resources that can be scheduled to it.\r\nRegions can be filtered with the global filters in various endpoints.",
      },
      {
        "name": "Skill",
        "description": "A skill represents a resource's competence to complete a call, e.g. a truck driver's license.\r\n            \r\nSkills can be referenced by calls and resources. When a call requires a certain skill, only\r\nresources that possess the required skill are allowed to be scheduled for the call. Skills can\r\nbe outfitted with a penalty, which decides on how impactful a skill restriction violation would be\r\nif the resource does not own the required skill.",
      },
      {
        "name": "Team",
        "description": "A team represents a group of resources.\r\n            \r\nTeams can be assigned to calls and resources. Assigning a team to an order can restrict the resources that can be scheduled to it.\r\nTeams can be filtered with the global filters in various endpoints.",
      },
    ],
}
