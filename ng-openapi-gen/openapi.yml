              "parameters":
                [
                  {
                    "name": "callId",
                    "in": "path",
                    "description": "Parameter within the path for the id of the call to update.",
                    "required": true,
                    "schema":
                      {
                        "allOf":
                          [{ "$ref": "#/components/schemas/iDs_callId" }],
                      },
                  },
                  {
                    "name": "scheduledCallUpdateMode",
                    "in": "query",
                    "description": "<p>One of:</p>\n<ul>\n<li>UNSCHEDULED: Do not update scheduled calls.</li>\n<li>WITHOUT_VIOLATIONS: Update scheduled calls only if no additional restrictions are violated compared to before the update.</li>\n</ul>\n",
                    "schema":
                      {
                        "pattern": "^(UNSCHEDULED|WITHOUT_VIOLATIONS)$",
                        "allOf":
                          [
                            {
                              "$ref": "#/components/schemas/enum_scheduledCallUpdateModeEnum",
                            },
                          ],
                        "description": "<p>One of:</p>\n<ul>\n<li>UNSCHEDULED: Do not update scheduled calls.</li>\n<li>WITHOUT_VIOLATIONS: Update scheduled calls only if no additional restrictions are violated compared to before the update.</li>\n</ul>\n",
