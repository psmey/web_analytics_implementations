<h1>Calls</h1>

<button mat-fab extended (click)="openDialog()" class="color-primary">
  <mat-icon>add</mat-icon>
  Add call
</button>

<button mat-fab extended (click)="startOptimization()" class="color-primary">
  <mat-icon>schedule</mat-icon>
  Schedule Calls
</button>

<app-table [dataSource]="calls" [columns]="columns"></app-table>
