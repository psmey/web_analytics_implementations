<h2 mat-dialog-title>Create Resource</h2>

<mat-dialog-content>
  <form [formGroup]="formGroup">
    <div>
      <h3>Resource</h3>

      <mat-form-field>
        <mat-label>Id</mat-label>
        <input matInput formControlName="id" required />
      </mat-form-field>
    </div>

    <div>
      <h3>Location</h3>

      <div>
        <mat-form-field>
          <mat-label>Street</mat-label>
          <input matInput formControlName="street" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>City</mat-label>
          <input matInput formControlName="city" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Postalcode</mat-label>
          <input matInput formControlName="postalcode" required />
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button
    mat-flat-button
    mat-dialog-close
    class="color-error"
    data-testid="cancel-button">
    Cancel
  </button>
  <button
    mat-flat-button
    [disabled]="!formGroup.valid"
    [mat-dialog-close]="formGroup.value"
    data-testid="create-button">
    Create
  </button>
</mat-dialog-actions>
