<h2 mat-dialog-title>Create Resource</h2>

<mat-dialog-content>
  <form [formGroup]="formGroup">
    <mat-form-field>
      <mat-label>Id</mat-label>
      <input matInput formControlName="id" required />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close color="warn">Cancel</button>
  <button
    mat-flat-button
    [disabled]="!formGroup.valid"
    [mat-dialog-close]="formGroup.value">
    Create
  </button>
</mat-dialog-actions>
