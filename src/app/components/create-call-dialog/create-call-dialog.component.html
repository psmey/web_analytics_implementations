<h2 mat-dialog-title>Create Call</h2>

<mat-dialog-content>
  <form [formGroup]="formGroup">
    <div>
      <h3>Call</h3>

      <mat-form-field>
        <mat-label>Id</mat-label>
        <input matInput formControlName="id" required />
      </mat-form-field>
    </div>

    <div formGroupName="address">
      <h3>Address</h3>

      <div>
        <mat-form-field>
          <mat-label>Street</mat-label>
          <input matInput formControlName="street" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>City</mat-label>
          <input matInput formControlName="city" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Postalcode</mat-label>
          <input matInput formControlName="postalcode" required />
        </mat-form-field>
      </div>
    </div>

    <div formGroupName="timeRestrictions">
      <h3>Time</h3>

      <mat-form-field>
        <mat-label>Duration in minutes</mat-label>
        <input matInput formControlName="duration" required />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Date range</mat-label>
        <mat-date-range-input [rangePicker]="picker">
          <input matStartDate formControlName="startDate" required />
          <input matEndDate formControlName="endDate" required />
        </mat-date-range-input>
        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker"></mat-datepicker-toggle>
        <mat-date-range-picker #picker></mat-date-range-picker>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button
    mat-flat-button
    [disabled]="!formGroup.valid"
    [mat-dialog-close]="formGroup.value">
    Create
  </button>
</mat-dialog-actions>
